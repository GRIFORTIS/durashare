name: Release Verify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (e.g., v0.7.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-published-release:
    name: Verify published release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Resolve tag
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "release" ]; then
            TAG_NAME="${RELEASE_TAG}"
          else
            TAG_NAME="${INPUT_TAG}"
          fi
          if [ -z "${TAG_NAME}" ]; then
            echo "Missing release tag" >&2
            exit 1
          fi
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Checkout verifier (workflow commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Fetch the release tag
        shell: bash
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"

      - name: Verify tag/whitepaper version alignment (strict)
        shell: bash
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess
          tag = os.environ["TAG_NAME"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Invalid tag format: {tag!r} (expected vX.Y.Z)")
          tex = subprocess.check_output(
              ["git", "show", f"{tag}:whitepaper/WHITEPAPER.tex"],
              text=True,
          )
          m = re.search(r"\\newcommand\{\\DuraShareVersion\}\{([^}]+)\}", tex)
          if not m:
              m = re.search(r"\\newcommand\{\\SchiavinatoSharingVersion\}\{([^}]+)\}", tex)
          if not m:
              raise SystemExit("Missing version macro in tagged whitepaper/WHITEPAPER.tex")
          version = m.group(1).strip()
          if version != tag:
              raise SystemExit(f"Tag/whitepaper mismatch: tag={tag!r} whitepaper={version!r}")
          print(f"OK: tag={tag} whitepaper={version}")
          PY

      - name: Verify published release assets, signatures, and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x scripts/verify-published-release.sh scripts/verify-checksums.sh
          ./scripts/verify-published-release.sh "${TAG_NAME}"
